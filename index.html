<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZVIAZKIVETS | Engineering Portal</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #14171c;
            --card-hover: #1c2027;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-scanner: #06b6d4; /* Сигнальний блакитний для сканера */
            --accent-swr: #f59e0b;     /* Інженерний бурштуновий для КСХ */
            --border-color: #22272f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Текстура сітки на бекграунді для інженерного стилю */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
            z-index: 1;
        }

        header {
            margin-bottom: 50px;
        }

        .logo-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .logo-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }

        .portal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 40px 30px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .portal-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: transparent;
            transition: background-color 0.3s ease;
        }

        /* Стилізація картки Scanner */
        .card-scanner::before {
            background: var(--accent-scanner);
            opacity: 0.3;
        }

        .card-scanner:hover::before {
            opacity: 1;
        }

        .card-scanner:hover {
            border-color: var(--accent-scanner);
            box-shadow: 0 10px 30px -10px rgba(6, 182, 212, 0.15);
            background-color: var(--card-hover);
            transform: translateY(-2px);
        }

        /* Стилізація картки SWR */
        .card-swr::before {
            background: var(--accent-swr);
            opacity: 0.3;
        }

        .card-swr:hover::before {
            opacity: 1;
        }

        .card-swr:hover {
            border-color: var(--accent-swr);
            box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.15);
            background-color: var(--card-hover);
            transform: translateY(-2px);
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-scanner .card-icon { color: var(--accent-scanner); }
        .card-swr .card-icon { color: var(--accent-swr); }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
        }

        .card-desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
            max-width: 280px;
        }

        .btn {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 12px 24px;
            border-radius: 4px;
            border: 1px solid;
            background: transparent;
            transition: all 0.2s ease;
            width: 100%;
        }

        .card-scanner .btn {
            border-color: rgba(6, 182, 212, 0.3);
            color: var(--accent-scanner);
        }

        .card-scanner:hover .btn {
            background-color: var(--accent-scanner);
            color: var(--bg-color);
            border-color: var(--accent-scanner);
        }

        .card-swr .btn {
            border-color: rgba(245, 158, 11, 0.3);
            color: var(--accent-swr);
        }

        .card-swr:hover .btn {
            background-color: var(--accent-swr);
            color: var(--bg-color);
            border-color: var(--accent-swr);
        }

        footer {
            font-size: 11px;
            color: rgba(148, 163, 184, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-title">ZVIAZKIVETS</div>
            <div class="logo-subtitle">Engineering Portal</div>
        </header>

        <div class="portal-grid">
            
            <!-- Посилання на Live Scanner -->
            <a href="/zviazkivets_docs/swr_constructor" class="portal-card card-scanner">
                <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                    <div class="card-icon">
                        <!-- SVG іконка спектру/радіохвиль -->
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v20M17 5v14M22 8v8M7 8v8M2 10v4"/>
                        </svg>
                    </div>
                    <div class="card-title">Live Scanner 5G8</div>
                    <div class="card-desc">Моніторинг радіочастотного спектру та аналіз сигналів у реальному часі.</div>
                </div>
                <button class="btn">Запустити</button>
            </a>

            <!-- Посилання на SWR Constructor -->
            <a href="/zviazkivets_docs/zviazkivets_tester" class="portal-card card-swr">
                <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                    <div class="card-icon">
                        <!-- SVG іконка розрахунків/антени -->
                        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20v-8M5 12V9a7 7 0 0 1 14 0v3M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        </svg>
                    </div>
                    <div class="card-title">SWR Constructor</div>
                    <div class="card-desc">Розрахунок коефіцієнта стоячої хвилі та моделювання узгодження антенних систем.</div>
                </div>
                <button class="btn">Відкрити</button>
            </a>

        </div>

        <footer>
            &copy; 2026 ZVIAZKIVETS. Hardware & Software Solutions.
        </footer>
    </div>

</body>
</html>
