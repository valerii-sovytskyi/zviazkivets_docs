<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZVIAZKIVETS Antenna Tuner</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-dragdata@2.2.3/dist/chartjs-plugin-dragdata.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@1.2.1/dist/chartjs-plugin-zoom.min.js"></script>

    <link rel="stylesheet" href="css/swr_constructor.css">
</head>
<body>

    <h2>ZVIAZKIVETS SWR Constructor</h2>
    <div class="info">
        Колесо мишки: <b>Зум</b> | Ліва кнопка + рух: <b>Переміщення</b> | Тягнути точку: <b>Зміна КСХ</b>
    </div>

    <div class="chart-container">
        <canvas id="swrChart"></canvas>
    </div>

    <div class="controls three-cols">
        
        <!-- БЛОК 1: RX Антена -->
        <div class="col-panel panel-rx">
            <h3 style="color: #ff4444;">📡 RX Антена</h3>
            <textarea id="rxRaw" placeholder="Масив КСХ (1.20, 1.30...)"></textarea>
            <select id="rxPreset" onchange="loadPreset(this, 'RX')">
                <option value="">📂 Обрати пресет...</option>
                <option value="flat">Ідеальний КСХ (1.0)</option>
            </select>
            <div style="font-size: 12px; color: #888;">Імпорт .s1p:</div>
            <input type="file" id="rxS1p" accept=".s1p" onchange="handleNanoVNAUpload(this, 'RX')">
        </div>

        <!-- БЛОК 2: TX Антена -->
        <div class="col-panel panel-tx">
            <h3 style="color: #00d2ff;">📡 TX Антена</h3>
            <textarea id="txRaw" placeholder="Масив КСХ (1.20, 1.30...)"></textarea>
            <select id="txPreset" onchange="loadPreset(this, 'TX')">
                <option value="">📂 Обрати пресет...</option>
                <option value="flat">Ідеальний КСХ (1.0)</option>
            </select>
            <div style="font-size: 12px; color: #888;">Імпорт .s1p:</div>
            <input type="file" id="txS1p" accept=".s1p" onchange="handleNanoVNAUpload(this, 'TX')">
        </div>

        <!-- БЛОК 3: Результуючий КСХ -->
        <div class="col-panel panel-combined">
            <h3 style="color: #ffd700;">⚡ Результуючий (MAX)</h3>
            <textarea id="combinedRaw" placeholder="Згладжений масив КСХ"></textarea>
            <select id="combinedPreset" onchange="loadPreset(this, 'COMBINED')">
                <option value="">📂 Обрати пресет...</option>
                <option value="flat">Скинути на 1.0</option>
            </select>
            <div style="font-size: 12px; color: #888;">Імпорт .s1p (замінить результат):</div>
            <input type="file" id="combinedS1p" accept=".s1p" onchange="handleNanoVNAUpload(this, 'COMBINED')">
        </div>

    </div>

    <script src="js/swr_constructor.js"></script>
</body>
</html>
